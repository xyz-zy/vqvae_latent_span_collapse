seed_everything: 3407

data:
  class_path: decoder.dataset.VocosDataModule
  init_args:
    train_params:
      filelist_path: ./train_filelist.txt
      sampling_rate: 24000
      num_samples: 72000
      batch_size: 40
      num_workers: 8

    val_params:
      filelist_path: ./dev_filelist.txt
      sampling_rate: 24000
      num_samples: 72000
      batch_size: 5
      num_workers: 8

model:
  class_path: decoder.experiment.WavTokenizer
  init_args:
    plot_every_n_steps: 1000
    sample_rate: 24000
    initial_learning_rate: 2e-4
    mel_loss_coeff: 45
    mrd_loss_coeff: 1.0
    num_warmup_steps: 0
    pretrain_mel_steps: 0

    commit_loss_coeff: 1000.0

    # automatic evaluation
    evaluate_utmos: true
    evaluate_pesq: true
    evaluate_periodicty: true

    resume: false
    resume_config: ../novq/configs/wavtokenizer_smalldata_frame75_3s_nq1_novq_dim512_kmeans200_attn_2gpu.yaml
    resume_model: ../novq/novq/ep42_k4096_n40960/ep42_kmeans_sklearnpp_40960_thresh1.0.ckpt

    feature_extractor:
      class_path: decoder.feature_extractors.EncodecFeatures
      init_args:
        encodec_model: encodec_24khz
        bandwidths: [6.6, 6.6, 6.6, 6.6]
        train_codebooks: true
        num_quantizers: 1
        dowmsamples: [8, 5, 4, 2]
        vq_bins: 4096
        vq_kmeans: 200
        # Effective threshold = 1.0 * world_size = 2.0 on 2 GPUs.
        # The notebook sets cluster_size=2.0 for all codes. This repo's expire_codes_
        # uses `cluster_size < threshold_ema_dead_code * world_size`; the strict "<"
        # means 2.0 < 2.0 is False, so no codes are expired on step 1 and the kmeans
        # codebook is preserved. Respawning then works normally for unused codes
        # thereafter. Equivalent to threshold=2.0 in the single-GPU novq repo.
        threshold_ema_dead_code: 0.5

    backbone:
      class_path: decoder.models.VocosBackbone
      init_args:
        input_channels: 512
        dim: 768
        intermediate_dim: 2304
        num_layers: 12
        adanorm_num_embeddings: 4

    head:
      class_path: decoder.heads.ISTFTHead
      init_args:
        dim: 768
        n_fft: 1280
        hop_length: 320
        padding: same

trainer:
  logger:
    class_path: pytorch_lightning.loggers.TensorBoardLogger
    init_args:
      save_dir: ./result/train/wavtokenizer_smalldata_frame75_3s_nq1_novq_dim512_kmeans200_attn_2gpu_code4096_offline_sklearn_40960_thresh0.5/
  callbacks:
    - class_path: pytorch_lightning.callbacks.LearningRateMonitor
    - class_path: pytorch_lightning.callbacks.ModelSummary
      init_args:
        max_depth: 2
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        monitor: val_loss
        filename: wavtokenizer_checkpoint_{epoch}_{step}_{val_loss:.4f}
        save_top_k: 10
        save_last: true
    - class_path: decoder.helpers.GradNormCallback

  # Lightning calculates max_steps across all optimizer steps (rather than number of batches)
  # This equals to 1M steps per generator and 1M per discriminator
  max_steps: 2000000
  # You might want to limit val batches when evaluating all the metrics, as they are time-consuming
  limit_val_batches: 100
  accelerator: gpu
  strategy: ddp
  devices: [0,1]
  log_every_n_steps: 1000
