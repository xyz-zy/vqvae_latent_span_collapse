model:
  base_learning_rate: 4.5e-6
  target: taming.models.ae.AEModel
  params:
    embed_dim: 256
    # no n_embed needed — AEModel uses taming.models.ae and replaces quantize with Identity
    ddconfig:
      double_z: False
      z_channels: 256
      resolution: 128
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [1, 1, 2, 2, 4]
      num_res_blocks: 2
      attn_resolutions: [16]
      dropout: 0.0

    lossconfig:
      target: taming.modules.losses.vqperceptual.VQLPIPSWithDiscriminator
      params:
        disc_conditional: False
        disc_in_channels: 3
        disc_start: 100000000    # disc disabled
        disc_weight: 0.8
        codebook_weight: 0.0     # no codebook -> zero the VQ loss contribution
        perceptual_weight: 1.0

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 16
    num_workers: 4
    train:
      target: taming.data.custom.CustomTrain
      params:
        training_images_list_file: data/imagenet100_train.txt
        size: 128
    validation:
      target: taming.data.custom.CustomTest
      params:
        test_images_list_file: data/imagenet100_val.txt
        size: 128
